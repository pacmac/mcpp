name: render
scope: local
about: "Renders web pages via Playwright and returns metadata, text, and structure. Use when you need to inspect how a page looks or behaves."

tools:
  - name: render
    description: "Render a page using rendermod (Playwright-based). Requires render.yaml in the workspace."
    inputSchema:
      type: object
      properties:
        page:
          type: string
          description: "Page name or path to render"
        device:
          type: string
          description: "Device type: mobile, tablet, or desktop"
        args:
          type: object
          description: "Query-string overrides as key-value pairs"
      required:
        - page
